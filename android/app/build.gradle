plugins {
    id 'com.android.application'
}

android {
    namespace 'in.standtall.adhan'
    compileSdk 34

    defaultConfig {
        applicationId 'in.standtall.adhan'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            storeFile file('../adhan.keystore')
            storePassword 'standtall'
            keyAlias 'adhan'
            keyPassword 'standtall'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
