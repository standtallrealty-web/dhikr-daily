name: Build Dhikr Adhan APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Keep a copy of the APK
        uses: actions/upload-artifact@v4
        with:
          name: dhikr-adhan-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish APK on the site
        run: |
          git rm -q -f public/dhikr-adhan*.apk || true
          cp android/app/build/outputs/apk/release/app-release.apk public/dhikr-adhan-r${{ github.run_number }}.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          VC=$(grep -o 'versionCode [0-9]*' android/app/build.gradle | grep -o '[0-9]*$')
          VN=$(grep -o "versionName '[^']*'" android/app/build.gradle | cut -d"'" -f2)
          echo "{\"code\":$VC,\"name\":\"$VN\",\"apk\":\"dhikr-adhan-r${{ github.run_number }}.apk\"}" > public/version.json
          git add public/version.json
          git add public/dhikr-adhan-r${{ github.run_number }}.apk
          git commit -m "Update Dhikr Adhan APK" || echo "no change"
          git pull --rebase origin main
          git push origin HEAD:main
